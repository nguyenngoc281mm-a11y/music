<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101018">
  <meta name="description" content="Suno 음악">
  <title>Suno Music</title>
  <style>
    :root { color-scheme: dark; --bg:#101018; --text:#f5f4fb; --muted:#aaa8bd; --accent:#c4a7ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
      background: radial-gradient(circle at 50% 10%, #30244b 0, var(--bg) 48%);
    }
    main {
      width: min(100%, 560px); padding: 32px; border: 1px solid #ffffff18;
      border-radius: 28px; background: #1b1b28e8; box-shadow: 0 24px 80px #0007;
      text-align: center;
    }
    .cover {
      width: 190px; aspect-ratio: 1; margin: 0 auto 26px; border-radius: 22px;
      display: grid; place-items: center; font-size: 64px;
      background: linear-gradient(145deg, #8d70c8, #25233e 65%, #171722);
      box-shadow: 0 12px 40px #0006;
    }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 38px); letter-spacing: -.04em; }
    .subtitle { margin: 10px 0 26px; color: var(--muted); }
    .notice { padding: 16px; border-radius: 16px; background: #ffffff09; color: var(--muted); line-height: 1.65; font-size: 14px; }
    a.button {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 22px; padding: 14px 22px; border-radius: 999px;
      background: var(--accent); color: #191323; font-weight: 750; text-decoration: none;
      transition: transform .15s ease, opacity .15s ease;
    }
    a.button:hover { transform: translateY(-2px); opacity: .92; }
    footer { margin-top: 24px; font-size: 12px; color: #858298; }
  </style>
</head>
<body>
  <main>
    <div class="cover" aria-hidden="true">♫</div>
    <h1>나의 새로운 노래</h1>
    <p class="subtitle">Suno Music</p>
    <div class="notice">
      이 페이지에서 원본 Suno 곡을 열 수 있습니다.<br>
      웹페이지 안에서 바로 재생하려면 MP3 파일을 내려받아 저장소에 업로드한 뒤 오디오 플레이어를 추가하세요.
    </div>
    <a class="button" href="https://suno.com/s/7XDzooalZuKeCq1G" target="_blank" rel="noopener noreferrer">
      ▶ Suno에서 노래 듣기
    </a>
    <footer>Music page · GitHub Pages</footer>
  </main>
</body>
</html>
